name: WHP Bash allocation arithmetic

on:
  push:
    branches: [master]
    paths:
      - 'hashlib.c'
      - 'subst.c'
      - 'tests/whp-hash-overflow.py'
      - 'tests/whp-subst-buffer.py'
      - '.github/workflows/whp-hash-memory.yml'
  pull_request:
    paths:
      - 'hashlib.c'
      - 'subst.c'
      - 'tests/whp-hash-overflow.py'
      - 'tests/whp-subst-buffer.py'
      - '.github/workflows/whp-hash-memory.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checked-memory:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out Bash fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify hash growth under Clang UBSan
        env:
          CC: clang
        run: python3 tests/whp-hash-overflow.py
      - name: Verify hash growth under GCC UBSan
        env:
          CC: gcc
        run: python3 tests/whp-hash-overflow.py
      - name: Verify substitution buffer growth under Clang UBSan
        env:
          CC: clang
        run: python3 tests/whp-subst-buffer.py
      - name: Verify substitution buffer growth under GCC UBSan
        env:
          CC: gcc
        run: python3 tests/whp-subst-buffer.py
